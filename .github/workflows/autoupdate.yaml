name: Autoupdate go.mod and go.sum

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  autoupdate:
    uses: lukaszraczylo/shared-actions/.github/workflows/go-autoupdate.yaml@72ef4441eb6e36c1e8c5d26d91cd1a3470c63d61 # main
    with:
      go-version: "1.25"
      release-workflow: "release.yaml"
    secrets: inherit
