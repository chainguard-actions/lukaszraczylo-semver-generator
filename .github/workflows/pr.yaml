name: Pull Request

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
      - "!main"

permissions:
  contents: read

jobs:
  pr-checks:
    uses: lukaszraczylo/shared-actions/.github/workflows/go-pr.yaml@72ef4441eb6e36c1e8c5d26d91cd1a3470c63d61 # main
    with:
      go-version: "1.25"
