name: Test local repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          config_file: tests/fixtures/semver-config.yaml
          repository_local: "true"
      - name: Assert semantic version output
        env:
          ACTUAL: ${{ steps.action.outputs.semantic_version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: output is not a semantic version"
            exit 1
          fi
          MAJOR="$(echo "$ACTUAL" | sed -E 's/^v?([0-9]+)\..*/\1/')"
          if [ "$MAJOR" -lt 1 ]; then
            echo "FAIL: forced major 1 not respected (major=$MAJOR)"
            exit 1
          fi
          echo "PASS"
