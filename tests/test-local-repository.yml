name: Test local repository mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: semver
        uses: .
        with:
          repository_local: "true"
        continue-on-error: true
      - name: Assert semantic version output
        env:
          SEMVER: ${{ steps.semver.outputs.semantic_version }}
          OUTCOME: ${{ steps.semver.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "semantic_version: $SEMVER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SEMVER" ]; then
              echo "FAIL: action succeeded but semantic_version output is empty"
              exit 1
            fi
            # Validate it looks like a semver (digits separated by dots)
            if echo "$SEMVER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "PASS: got valid semantic version '$SEMVER'"
            else
              echo "FAIL: output '$SEMVER' does not look like a semantic version"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (local repo may not have expected commit history)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
