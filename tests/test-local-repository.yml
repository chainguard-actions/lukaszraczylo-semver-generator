name: Test local repository mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: semver
        uses: .
        continue-on-error: true
        with:
          repository_local: "true"
          config_file: "/go/src/app/config.yaml"

      - name: Assert semantic_version output is set
        env:
          SEMVER: ${{ steps.semver.outputs.semantic_version }}
          OUTCOME: ${{ steps.semver.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "semantic_version: $SEMVER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SEMVER" ]; then
              echo "FAIL: action succeeded but semantic_version output is empty"
              exit 1
            fi
            if ! echo "$SEMVER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: '$SEMVER' does not look like a semantic version (expected X.Y.Z)"
              exit 1
            fi
            echo "PASS: got semantic version '$SEMVER'"
          else
            echo "PASS: action did not succeed (outcome='$OUTCOME'), accepted gracefully"
          fi
