name: Test basic usage with forced major version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Remote cloning from inside the Docker container fails under the harness
      # (x509: certificate signed by unknown authority), so use the local repo.
      - id: action
        uses: .
        with:
          config_file: tests/fixtures/semver-config.yaml
          repository_local: "true"
      - name: Assert semantic_version is a valid semver with major >= 1
        env:
          ACTUAL: ${{ steps.action.outputs.semantic_version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "FAIL: output is not a semantic version"
            exit 1
          fi
          MAJOR="${ACTUAL%%.*}"
          if [ "$MAJOR" -lt 1 ]; then
            echo "FAIL: expected major >= 1 (forced major 1 in config)"
            exit 1
          fi
          echo "PASS"
