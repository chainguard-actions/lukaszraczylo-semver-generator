name: Test basic remote repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: semver
        uses: .
        with:
          repository_url: "https://github.com/lukaszraczylo/simple-gql-client"
        continue-on-error: true
      - name: Assert semantic version output
        env:
          SEMVER: ${{ steps.semver.outputs.semantic_version }}
          OUTCOME: ${{ steps.semver.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "semantic_version: $SEMVER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SEMVER" ]; then
              echo "FAIL: action succeeded but semantic_version output is empty"
              exit 1
            fi
            # Validate it looks like a semver (digits separated by dots)
            if echo "$SEMVER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "PASS: got valid semantic version '$SEMVER'"
            else
              echo "FAIL: output '$SEMVER' does not look like a semantic version"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/API issue in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
