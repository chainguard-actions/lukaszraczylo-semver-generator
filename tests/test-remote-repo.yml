name: Test remote repository (default URL)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Anonymous clone of the default public repository_url (no credentials:
      # the harness token is scoped to a different repo and HTTP basic auth
      # with it is not needed for a public clone).
      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: tests/fixtures/semver-config.yaml
      - name: Assert semantic version (or graceful failure if remote clone unavailable)
        env:
          ACTUAL: ${{ steps.action.outputs.semantic_version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            LAST=$(echo "$ACTUAL" | awk '{print $NF}')
            if ! echo "$LAST" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
              echo "FAIL: action succeeded but output is not a semantic version: '$LAST'"
              exit 1
            fi
            echo "PASS: got '$LAST'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$ACTUAL" ]; then
              echo "FAIL: action failed but still emitted a version: '$ACTUAL'"
              exit 1
            fi
            echo "PASS: remote clone not possible in the harness container; action failed without emitting a version"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
