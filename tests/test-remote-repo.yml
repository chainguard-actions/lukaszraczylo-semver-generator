name: Test local repository respecting existing tags
# NOTE: cloning a remote repository over HTTPS is impossible under the harness:
# the action's Docker image does not trust the harness TLS proxy CA
# ("x509: certificate signed by unknown authority"). This scenario therefore
# exercises the "existing" (respect existing tags) flag against the already
# checked-out repository instead.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a tag on HEAD
        run: |
          git tag -f v3.0.0 HEAD
          git tag --list
      - id: action
        uses: .
        with:
          config_file: tests/fixtures/semver-config.yaml
          repository_local: "true"
          existing: "true"
      - name: Assert semantic_version is a semver
        env:
          ACTUAL: ${{ steps.action.outputs.semantic_version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: expected semantic version like X.Y.Z"
            exit 1
          fi
          echo "PASS"
