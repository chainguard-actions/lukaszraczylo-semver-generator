name: Test respecting an existing tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Point HEAD at a synthetic history with a tagged commit
        run: |
          set -e
          export GIT_AUTHOR_NAME=Test GIT_AUTHOR_EMAIL=test@example.com
          export GIT_COMMITTER_NAME=Test GIT_COMMITTER_EMAIL=test@example.com
          git symbolic-ref HEAD > /tmp/orig-head
          TREE=$(git mktree < /dev/null)
          mk() { ts="$1"; shift; GIT_AUTHOR_DATE="@$ts +0000" GIT_COMMITTER_DATE="@$ts +0000" git commit-tree "$TREE" "$@"; }
          c1=$(mk 1704067201 -m "xxbreak stuff")
          c2=$(mk 1704067202 -p "$c1" -m "kkfeat thing")
          c3=$(mk 1704067203 -p "$c2" -m "qqfix one")
          c4=$(mk 1704067204 -p "$c3" -m "qqfix two")
          c5=$(mk 1704067205 -p "$c4" -m "docs only")
          git tag -f v7.4.0 "$c2"
          git update-ref refs/heads/semver-test-existing "$c5"
          git symbolic-ref HEAD refs/heads/semver-test-existing
          git log --oneline --decorate HEAD
      - id: action
        uses: .
        with:
          config_file: tests/fixtures/semver-config.yaml
          repository_local: "true"
          strict: "true"
          existing: "true"
      - name: Restore HEAD
        if: always()
        run: |
          git symbolic-ref HEAD "$(cat /tmp/orig-head)" || true
          git update-ref -d refs/heads/semver-test-existing || true
          git tag -d v7.4.0 || true
      - name: Assert semantic version
        env:
          ACTUAL: ${{ steps.action.outputs.semantic_version }}
        run: |
          echo "actual: $ACTUAL"
          # starts from tag v7.4.0 on the kkfeat commit, then strict: qqfix x2 -> 7.4.2
          if [ "$ACTUAL" != "7.4.2" ]; then
            echo "FAIL: expected '7.4.2'"
            exit 1
          fi
          echo "PASS"
