name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: ${{ github.workspace }}/tests/fixtures/semver-config.yaml
          repository_url: "https://github.com/lukaszraczylo/simple-gql-client"
          debugmode: "true"

      - name: Assert semantic_version output or graceful failure in debug mode
        env:
          SEMVER: ${{ steps.action.outputs.semantic_version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "semantic_version: $SEMVER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SEMVER" ]; then
              echo "FAIL: action succeeded but semantic_version output is empty in debug mode"
              exit 1
            fi
            # Validate it looks like a semver (digits separated by dots)
            if ! echo "$SEMVER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: semantic_version '$SEMVER' does not look like a semver"
              exit 1
            fi
            echo "PASS: got semantic_version '$SEMVER' in debug mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (remote repo or Docker image not accessible)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
