name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          repository_url: "https://github.com/lukaszraczylo/simple-gql-client"
          config_file: "${{ github.workspace }}/tests/fixtures/semver-config/config.yaml"
          debugmode: "true"

      - name: Assert semantic_version output is set in debug mode
        env:
          ACTUAL: ${{ steps.action.outputs.semantic_version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACTUAL" ]; then
              echo "FAIL: action succeeded but semantic_version output is empty in debug mode"
              exit 1
            fi
            if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: '$ACTUAL' does not look like a semantic version"
              exit 1
            fi
            echo "PASS: semantic_version='$ACTUAL' (debug mode)"
          elif [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "skipped" ]; then
            echo "PASS: action did not succeed (outcome=$OUTCOME) - Docker image may not be available in harness"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
