name: Test strict and debug mode against local repository
# Remote HTTPS cloning fails under the harness (Docker image does not trust the
# TLS proxy CA), so strict + debug mode are exercised on the checked-out repo.
# In debug mode the semantic_version output also contains the full debug log,
# which is too large to pass through an env var (execve "argument list too
# long"). The output is therefore written to a file via a quoted heredoc in the
# script body, and the version is taken from the last token.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          config_file: tests/fixtures/semver-config.yaml
          repository_local: "true"
          strict: "true"
          debugmode: "true"
      - name: Assert semantic_version ends with a semver
        run: |
          cat > /tmp/semver-output.txt <<'SEMVER_OUTPUT_EOF_MARKER'
          ${{ steps.action.outputs.semantic_version }}
          SEMVER_OUTPUT_EOF_MARKER
          echo "output size: $(wc -c < /tmp/semver-output.txt) bytes"
          VERSION="$(tr -s '[:space:]' '\n' < /tmp/semver-output.txt | grep -v '^$' | tail -n 1)"
          echo "version: $VERSION"
          if ! echo "$VERSION" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: expected semantic version like X.Y.Z as last token"
            exit 1
          fi
          echo "PASS"
