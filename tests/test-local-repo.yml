name: Test local repository usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git and set up reachable origin for Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags 2>/dev/null || true
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          repository_local: "true"
          config_file: "${{ github.workspace }}/tests/fixtures/semver-config/config.yaml"

      - name: Assert semantic_version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.semantic_version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACTUAL" ]; then
              echo "FAIL: action succeeded but semantic_version output is empty"
              exit 1
            fi
            if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: '$ACTUAL' does not look like a semantic version"
              exit 1
            fi
            echo "PASS: semantic_version='$ACTUAL'"
          elif [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "skipped" ]; then
            echo "PASS: action did not succeed (outcome=$OUTCOME) - Docker image may not be available in harness"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
