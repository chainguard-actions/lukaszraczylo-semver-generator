name: Test existing tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository_url: "https://github.com/lukaszraczylo/simple-gql-client"
          existing: "true"
        continue-on-error: true
      - name: Assert semantic version output
        env:
          RESULT: ${{ steps.action.outputs.semantic_version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "semantic_version: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but semantic_version output is empty"
              exit 1
            fi
            echo "PASS: got semantic_version '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/repo not reachable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
