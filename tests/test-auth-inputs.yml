name: Test github_token and github_username inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        with:
          repository_local: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_username: "github-actions"
          strict: "false"
          existing: "false"
          debugmode: "false"
      - name: Assert semantic_version output is set
        env:
          SEMVER: ${{ steps.action.outputs.semantic_version }}
        run: |
          echo "semantic_version: $SEMVER"
          if [ -z "$SEMVER" ]; then
            echo "FAIL: semantic_version output is empty"
            exit 1
          fi
          echo "PASS: got semantic_version '$SEMVER'"
