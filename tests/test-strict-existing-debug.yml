name: Test strict, existing and debug flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Remote cloning fails inside the Docker action under the harness (TLS
      # interception), so exercise the flags against the local checkout.
      - id: action
        uses: .
        with:
          config_file: tests/fixtures/semver-config.yaml
          repository_local: "true"
          strict: "true"
          existing: "true"
          debugmode: "true"
      # With debugmode on, the semantic_version output carries the full debug
      # log and is too large to pass through env (exec: argument list too long).
      # Evaluate it with short boolean expressions instead of expanding it.
      - name: Assert action succeeded and produced a version
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_OUTPUT: ${{ steps.action.outputs.semantic_version != '' }}
          HAS_DOT: ${{ contains(steps.action.outputs.semantic_version, '.') }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output non-empty: $HAS_OUTPUT"
          echo "output contains '.': $HAS_DOT"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action outcome success"
            exit 1
          fi
          if [ "$HAS_OUTPUT" != "true" ]; then
            echo "FAIL: semantic_version output is empty"
            exit 1
          fi
          if [ "$HAS_DOT" != "true" ]; then
            echo "FAIL: semantic_version output does not look like a version"
            exit 1
          fi
          echo "PASS"
