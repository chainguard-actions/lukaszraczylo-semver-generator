name: Test repository_url clone failure is reported (unreachable repository)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Earlier runs showed that a successful clone through repository_url cannot
      # happen under the harness: HTTPS fails TLS verification inside the
      # container, and file:// needs a git binary that the image does not have.
      # So this test covers the error path: a repository_url that cannot be
      # cloned must make the action fail and leave semantic_version unset.
      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: tests/fixtures/semver-config.yaml
          repository_url: file:///github/workspace/does-not-exist-repo
      - name: Assert action failed and produced no version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat > /tmp/semver-output.txt <<'SEMVER_OUTPUT_END_7f3a'
          ${{ steps.action.outputs.semantic_version }}
          SEMVER_OUTPUT_END_7f3a
          LAST="$(tr -s '[:space:]' '\n' < /tmp/semver-output.txt | grep -v '^$' | tail -n 1 || true)"
          echo "final output token: '$LAST'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail for an unclonable repository_url, got '$OUTCOME'"
            exit 1
          fi
          if echo "$LAST" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'; then
            echo "FAIL: expected no semantic version, got '$LAST'"
            exit 1
          fi
          echo "PASS"
