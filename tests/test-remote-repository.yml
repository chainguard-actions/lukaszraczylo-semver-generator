name: Test remote repository clone failure is reported
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Remote mode (no repository_local): the generator must clone repository_url.
      # Point it at an unreachable endpoint so the clone deterministically fails;
      # the action must then fail and must NOT emit a semantic_version output.
      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: tests/fixtures/semver.yaml
          repository_url: http://127.0.0.1:1/nonexistent/repository.git
      - name: Assert action failed and produced no version
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.semantic_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: '$RESULT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail for an unreachable remote repository"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no semantic_version output, got '$RESULT'"
            exit 1
          fi
          echo "PASS"
