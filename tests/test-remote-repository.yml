name: Test remote repository (default URL)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Remote mode clones an external repository from inside the Docker
      # container; that clone depends on outbound network access which is not
      # guaranteed under act. Accept a clean failure, but strictly validate the
      # output whenever the clone succeeds.
      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: tests/fixtures/semver-config.yaml
          repository_url: https://github.com/lukaszraczylo/simple-gql-client
      - name: Assert semantic_version is valid (or remote clone failed gracefully)
        env:
          ACTUAL: ${{ steps.action.outputs.semantic_version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$ACTUAL" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: action succeeded but output is not a semantic version"
              exit 1
            fi
            echo "PASS: got '$ACTUAL'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$ACTUAL" ]; then
              echo "FAIL: action failed but still set an output"
              exit 1
            fi
            echo "PASS: remote clone not possible in this environment; action failed cleanly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
