name: Test local repository with existing tags ignored
# Remote cloning (go-git over HTTPS) failed under the harness twice, both with
# and without credentials, so this file now covers a scenario that needs no
# network: the local repository with existing=false (don't use existing tags).
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          config_file: tests/fixtures/semver-basic.yaml
          repository_local: "true"
          existing: "false"
      - name: Assert semantic_version is a valid semver
        env:
          ACTUAL: ${{ steps.action.outputs.semantic_version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: expected a semantic version like X.Y.Z"
            exit 1
          fi
          echo "PASS"
