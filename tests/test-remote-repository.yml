name: Test remote repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: semver
        uses: .
        continue-on-error: true
        with:
          config_file: tests/fixtures/semver.yaml
          repository_url: https://github.com/lukaszraczylo/simple-gql-client
      - name: Assert semantic version output (or graceful failure on remote clone)
        env:
          RESULT: ${{ steps.semver.outputs.semantic_version }}
          OUTCOME: ${{ steps.semver.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$RESULT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: action succeeded but output is not a semantic version"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$RESULT" ]; then
              echo "FAIL: action failed but still set an output"
              exit 1
            fi
            echo "PASS: remote clone not possible in harness; action failed without output"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
