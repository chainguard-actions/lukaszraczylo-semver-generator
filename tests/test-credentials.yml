name: Test with github credentials supplied (local repository)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          config_file: tests/fixtures/semver-config.yaml
          repository_url: ""
          repository_local: "true"
          github_username: x-access-token
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert semantic version output
        env:
          ACTUAL: ${{ steps.action.outputs.semantic_version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: output is not a semantic version"
            exit 1
          fi
          echo "PASS"
