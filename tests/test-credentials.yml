name: Test remote clone with credentials inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Remote mode with github_username/github_token supplied. The remote is
      # unreachable, so the authenticated clone deterministically fails; the
      # action must accept the credential inputs, fail, and emit no version.
      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: tests/fixtures/semver.yaml
          repository_url: http://127.0.0.1:1/nonexistent/repository.git
          github_username: test-user
          github_token: test-password-not-a-real-token
      - name: Assert action failed and produced no version
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.semantic_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: '$RESULT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail for an unreachable remote repository"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no semantic_version output, got '$RESULT'"
            exit 1
          fi
          echo "PASS"
