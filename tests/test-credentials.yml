name: Test github_token and github_username inputs with local repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Credentials are only used for remote cloning; with repository_local they
      # must be accepted without breaking version calculation.
      - id: action
        uses: .
        with:
          config_file: tests/fixtures/semver-config.yaml
          repository_local: "true"
          github_username: act-test-user
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert semantic_version is a valid semver
        env:
          ACTUAL: ${{ steps.action.outputs.semantic_version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'; then
            echo "FAIL: '$ACTUAL' is not a semantic version"
            exit 1
          fi
          MAJOR="${ACTUAL%%.*}"
          if [ "$MAJOR" -lt 1 ]; then
            echo "FAIL: expected major >= 1 (forced via config), got $MAJOR"
            exit 1
          fi
          echo "PASS"
