name: Test with github credentials inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Remote cloning fails inside the container under the harness (x509),
      # so use the local repository; credentials are passed but not required.
      - id: action
        uses: .
        with:
          config_file: tests/fixtures/semver-config.yaml
          repository_local: "true"
          github_username: x-access-token
          github_token: ${{ github.token }}
      - name: Assert semantic_version is a valid semver
        env:
          ACTUAL: ${{ steps.action.outputs.semantic_version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "FAIL: output is not a semantic version"
            exit 1
          fi
          echo "PASS"
